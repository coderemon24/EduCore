context: |
  ### Project Overview
  - **Name**: Laravel School (EduCore School Management System)
  - **Repository Root**: `c:\laragon\www\laravel-school`
  - **Application Directory**: Root (`./`)
  - **Type**: Comprehensive School Management System & Academic ERP Platform.
  - **Core Application**: Robust administrative portal (`/admin/dashboard`), Student Information System (SIS), Faculty & Teacher directory, Class & Section scheduling, Attendance records, Examination & Grading, Fee Management, and Institution Telemetry.

  ### Technology Stack
  1. **Backend Framework**:
     - **Laravel 12** (`laravel/framework: ^12.0`)
     - **PHP Version**: PHP 8.2+ (Laragon environment)
     - **Architecture**: Modern Laravel 12 configuration (`bootstrap/app.php`), Route Grouping, Form Requests, Eloquent ORM, Blade Layouts.
     - **Code Formatter & Linter**: Laravel Pint (`laravel/pint: ^1.24`)
     - **Testing**: PHPUnit 11 (`phpunit/phpunit: ^11.5.50`)

  2. **Database & Storage**:
     - **DBMS**: MySQL 8.0 / MariaDB on Laragon (Host: `127.0.0.1:3306`, Database: `laravel-school`, Username: `root`, Password: ``).
     - **Session & Cache**: Database-backed sessions and cache tables.
     - **Media & File Storage**: Public storage disk (`public/uploads/` or `storage/app/public/`) for student avatars, teacher profiles, and school documents.

  3. **Frontend & UI Architecture**:
     - **Template Engine**: Laravel Blade (`resources/views/`)
     - **Bundler & Build Tool**: Vite 7 (`vite: ^7.0.7`, `laravel-vite-plugin: ^2.0.0`)
     - **CSS Framework**: Tailwind CSS v4 (`tailwindcss: ^4.0.0`, `@tailwindcss/vite`)
     - **Design Philosophy**: High-information-density, clean institutional design system following the "no-slop" protocol (no arbitrary glow/glassmorphism, crisp 1px borders, subtle functional accents, accessible typography, high contrast, responsive sidebar/header navigation).

