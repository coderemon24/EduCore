  ### Key Architectural Patterns & Domain Rules
  1. **Administrative Portal Architecture**:
     - Dedicated admin layout (`resources/views/layouts/admin.blade.php`) with reusable sidebar, top navigation bar, breadcrumbs, search, notification alerts, and quick actions.
     - Role-based capabilities (Super Admin, Academic Dean, Teacher, Accountant, Student/Parent).
  2. **Academic Domain Entities**:
     - **Students**: Admission number, class, section, roll number, guardian details, attendance telemetry, fee status.
     - **Faculty / Teachers**: Department, designation, assigned subjects, timetable scheduling.
     - **Academic Classes & Sections**: Grade levels (Class 1 - 12), capacity, class teacher assignments.
     - **Attendance**: Daily roll-call records with status (Present, Absent, Late, Excused).
     - **Fees & Billing**: Tuition, exam fees, invoices, payments, outstanding balance tracking.
  3. **Frontend Performance & Standards**:
     - Compile all styles via `@tailwindcss/vite` in [resources/css/app.css].
     - Use native Blade components and clean semantic markup with zero bloated AI-slop aesthetics.

